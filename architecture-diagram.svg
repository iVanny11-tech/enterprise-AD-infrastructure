<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6470"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#f7f8fa"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1d23">Enterprise AD Infrastructure — Network &amp; Logical Architecture</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#5b6470">AWS VPC · enterprise.local domain</text>

  <!-- AWS Cloud boundary -->
  <rect x="40" y="90" width="1120" height="640" rx="14" fill="#ffffff" stroke="#d5d9e0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="118" font-size="14" font-weight="700" fill="#ff9900">AWS Cloud — Region: ca-central-1</text>

  <!-- VPC boundary -->
  <rect x="70" y="140" width="1060" height="560" rx="12" fill="#f0f4ff" stroke="#8ea6e8" stroke-width="2"/>
  <text x="90" y="168" font-size="13" font-weight="700" fill="#3a5bbf">VPC — 10.0.0.0/16 (Enterprise-Lab-VPC)</text>

  <!-- Internet Gateway -->
  <rect x="540" y="185" width="150" height="46" rx="8" fill="#ffe9b3" stroke="#d99a00" stroke-width="1.5"/>
  <text x="615" y="213" text-anchor="middle" font-size="12" font-weight="600" fill="#6b4c00">Internet Gateway</text>

  <line x1="615" y1="231" x2="615" y2="260" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Subnet boundary -->
  <rect x="120" y="260" width="960" height="380" rx="10" fill="#eaf3ff" stroke="#6f9de0" stroke-width="1.5"/>
  <text x="140" y="286" font-size="12" font-weight="700" fill="#2a5b9c">Subnet — 10.0.1.0/24 (public)</text>

  <!-- Security Group boundary -->
  <rect x="150" y="300" width="900" height="320" rx="10" fill="#fff5f5" stroke="#e08a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="170" y="324" font-size="12" font-weight="700" fill="#b33a3a">Security Group — Enterprise-Server-SG</text>
  <text x="170" y="342" font-size="10" fill="#8a4a4a">Inbound: RDP/SSH (scoped IPs), HTTP/HTTPS (0.0.0.0/0), internal VPC CIDR (AD ports + ICMP)</text>

  <!-- DC01 -->
  <rect x="230" y="380" width="220" height="150" rx="10" fill="#dff0d8" stroke="#4a9e4a" stroke-width="2"/>
  <text x="340" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5c1f">DC01</text>
  <text x="340" y="424" text-anchor="middle" font-size="11" fill="#2d6b2d">Windows Server 2022</text>
  <text x="340" y="440" text-anchor="middle" font-size="11" fill="#2d6b2d">Domain Controller (AD DS)</text>
  <text x="340" y="456" text-anchor="middle" font-size="11" fill="#2d6b2d">DNS Server</text>
  <text x="340" y="476" text-anchor="middle" font-size="10" font-weight="600" fill="#1f5c1f">10.0.1.45 (private)</text>
  <text x="340" y="492" text-anchor="middle" font-size="10" fill="#2d6b2d">enterprise.local</text>
  <text x="340" y="510" text-anchor="middle" font-size="9" fill="#5c8a5c">t3.micro</text>

  <!-- CLIENT01 -->
  <rect x="600" y="380" width="220" height="150" rx="10" fill="#dbe9fb" stroke="#3a6ea5" stroke-width="2"/>
  <text x="710" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3f66">CLIENT01</text>
  <text x="710" y="424" text-anchor="middle" font-size="11" fill="#28578f">Windows Server 2022</text>
  <text x="710" y="440" text-anchor="middle" font-size="11" fill="#28578f">(client stand-in — no</text>
  <text x="710" y="454" text-anchor="middle" font-size="11" fill="#28578f">licensed Win11 AMI on EC2)</text>
  <text x="710" y="476" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3f66">10.0.1.66 (private)</text>
  <text x="710" y="492" text-anchor="middle" font-size="10" fill="#28578f">Domain-joined member</text>
  <text x="710" y="510" text-anchor="middle" font-size="9" fill="#5c7ea3">t3.micro</text>

  <!-- Connection DC01 <-> CLIENT01 -->
  <line x1="450" y1="455" x2="600" y2="455" stroke="#5b6470" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="525" y="445" text-anchor="middle" font-size="9.5" fill="#3a4048">DNS · Kerberos · LDAP · SMB</text>

  <!-- Admin workstation (external) -->
  <rect x="960" y="395" width="150" height="80" rx="8" fill="#f3e8ff" stroke="#8a5fc2" stroke-width="1.5"/>
  <text x="1035" y="425" text-anchor="middle" font-size="11" font-weight="700" fill="#4c2d80">Admin Workstation</text>
  <text x="1035" y="443" text-anchor="middle" font-size="10" fill="#5f3d99">(Mac + RDP client)</text>
  <text x="1035" y="459" text-anchor="middle" font-size="9" fill="#6f4aa8">scoped public IP</text>

  <line x1="960" y1="435" x2="820" y2="435" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="890" y="425" text-anchor="middle" font-size="9" fill="#3a4048">RDP</text>

  <line x1="960" y1="450" x2="450" y2="450" stroke="#5b6470" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- OU structure below -->
  <rect x="150" y="560" width="900" height="46" rx="8" fill="#fff2d9" stroke="#d9a441" stroke-width="1.5"/>
  <text x="600" y="588" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a5310">OUs: Domain Controllers · IT · HR · Finance · Sales · Groups · Servers · Service Accounts · Workstations</text>

  <!-- Legend -->
  <text x="90" y="710" font-size="10.5" fill="#5b6470">Solid double arrow = AD service traffic (DNS/Kerberos/LDAP/SMB)   |   Solid arrow = RDP   |   Dashed = internal VPC reachability</text>
  <text x="90" y="726" font-size="10.5" fill="#5b6470">Domain: enterprise.local   |   VPC CIDR: 10.0.0.0/16   |   Subnet: 10.0.1.0/24</text>
</svg>
