<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101c33"/>
      <stop offset="100%" stop-color="#1a2b4a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3a5c" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="8" height="260" fill="#4a8fe0"/>

  <!-- Icon: simple server/domain glyph -->
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="110" height="120" rx="10" fill="#16233d" stroke="#4a8fe0" stroke-width="2"/>
    <rect x="16" y="18" width="78" height="16" rx="3" fill="#2c4569"/>
    <rect x="16" y="42" width="78" height="16" rx="3" fill="#2c4569"/>
    <rect x="16" y="66" width="78" height="16" rx="3" fill="#2c4569"/>
    <circle cx="26" cy="26" r="3.2" fill="#5fd67e"/>
    <circle cx="26" cy="50" r="3.2" fill="#5fd67e"/>
    <circle cx="26" cy="74" r="3.2" fill="#e8b94a"/>
    <rect x="16" y="94" width="78" height="14" rx="3" fill="#243a5c"/>
    <text x="55" y="104" text-anchor="middle" font-size="9" fill="#8fb4e8" font-weight="600">enterprise.local</text>
  </g>

  <!-- Title block -->
  <text x="230" y="105" font-size="34" font-weight="800" fill="#ffffff">Enterprise Active Directory Infrastructure</text>
  <text x="230" y="140" font-size="17" fill="#9fb8dd">Deployment · Administration · Incident Response — on AWS</text>

  <!-- Tag chips -->
  <g font-size="12.5" font-weight="600">
    <rect x="230" y="165" width="88" height="30" rx="15" fill="#1c2f4f" stroke="#3a5c8c"/>
    <text x="274" y="184" text-anchor="middle" fill="#bcd4f5">AWS EC2</text>

    <rect x="328" y="165" width="72" height="30" rx="15" fill="#1c2f4f" stroke="#3a5c8c"/>
    <text x="364" y="184" text-anchor="middle" fill="#bcd4f5">VPC</text>

    <rect x="410" y="165" width="76" height="30" rx="15" fill="#1c2f4f" stroke="#3a5c8c"/>
    <text x="448" y="184" text-anchor="middle" fill="#bcd4f5">AD DS</text>

    <rect x="496" y="165" width="94" height="30" rx="15" fill="#1c2f4f" stroke="#3a5c8c"/>
    <text x="543" y="184" text-anchor="middle" fill="#bcd4f5">Group Policy</text>

    <rect x="600" y="165" width="106" height="30" rx="15" fill="#1c2f4f" stroke="#3a5c8c"/>
    <text x="653" y="184" text-anchor="middle" fill="#bcd4f5">PowerShell</text>

    <rect x="716" y="165" width="130" height="30" rx="15" fill="#1c2f4f" stroke="#3a5c8c"/>
    <text x="781" y="184" text-anchor="middle" fill="#bcd4f5">Incident Response</text>
  </g>
</svg>
